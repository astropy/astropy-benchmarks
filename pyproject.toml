[project]
name = "astropy-benchmarks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "asv>=0.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[tool.uv]
preview-features = [
    "index-exclude-newer",
]
no-build-package = [
    "contourpy",
    "kiwisolver",
    "matplotlib",
    "numpy",
    "pillow",
    "pyparsing",
    "scipy",
]

# this strategy matches pip's:
# always consider packages from all configured indexes
# It is called "unsafe" because it allows dependency confusion-based attacks
# but we trust anaconda.org's nightly channels because they only serve a
# very limited set of packages that can't easily be expanded.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
# explicitly configure PyPI as the first index to look up instead of the default
# fallback. This ensures that, if:
# 1. pre-releases are not allowed and
# 2. a package with a non-dev version is found on sp-nightlies,
# then it still won't be preferred over its PyPI counterpart.
name = "pypi"
url = "https://pypi.org/simple"
# exclude packages published less than a week ago (ISO 8601)
exclude-newer = "P7D"
# always allow arbitrarily new versions of astropy-iers-data
exclude-newer-package.astropy-iers-data = false

[[tool.uv.index]]
name = "astropy-nightlies"
url = "https://pypi.anaconda.org/astropy/simple"
exclude-newer = false
# cache metadata for up to 10min (600s), and packages for 12h (43200s)
cache-control = { api = "max-age=600", files = "max-age=43200, immutable" }

[[tool.uv.index]]
name = "erfa-nightlies"
url = "https://pypi.anaconda.org/liberfa/simple"
exclude-newer = false
# cache metadata for up to 10min (600s), and packages for 12h (43200s)
cache-control = { api = "max-age=600", files = "max-age=43200, immutable" }
